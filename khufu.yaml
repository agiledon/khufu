ide: claude
language: typescript
frameworks:
  ut: jest
  it: jest
  api: supertest
  e2e: playwright
directories:
  ut: __tests__/
  it: __tests__/integration/
  api: __tests__/api/
  e2e: e2e/
coverage:
  ut:
    tool: jest
    thresholds:
      line: 80
      branch: 70
      function: 80
    formats:
      - lcov
      - html
      - text
    excludes:
      - '**/*.d.ts'
      - '**/index.ts'
      - '**/*.config.*'
  it:
    tool: jest
    thresholds:
      line: 60
      branch: 50
    formats:
      - lcov
      - html
    excludes:
      - '**/*.config.*'

# Test categories (v0.2.0)
categories:
  fragile:
    excludeFromCI: true       # CI excludes fragile tests by default
    runOnSchedule: weekly     # Run fragile tests on schedule (weekly/daily/manual)

# Specification-Driven Development (v0.2.0)
spec:
  enabled: true
  directory: specs/
  format: markdown            # Spec file format: markdown
  versioning: file-based      # spec.v1.md, spec.v2.md
  autoGenerateFromTests: true # Auto-generate specs in code-based mode

# Evaluation-Driven Development (v0.2.0)
evaluation:
  enabled: true
  failOnUnmetCriteria: warning  # CI behavior: warning | error
  dimensions:                   # Enabled evaluation dimensions
    - correctness
    - coverage
    - performance
    - maintainability
  thresholds:                   # Default thresholds (can be overridden per spec)
    ut:
      lineCoverage: 80
      branchCoverage: 70
      maxTestMs: 100
      maxFragileRatio: 20
    it:
      lineCoverage: 60
      branchCoverage: 50
      maxTestMsH2: 2000
      maxTestMsPostgres: 10000

# Test data factories (v0.2.0)
dataFactories:
  directory: tests/factories/  # Shared test data factory location
  reuseAcrossLayers: true      # Enable reuse across IT, API, E2E

scope: project
