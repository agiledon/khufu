ide: claude
language: typescript
frameworks:
  ut: jest
  it: jest
  api: supertest
  e2e: playwright
directories:
  ut: __tests__/
  it: __tests__/integration/
  api: __tests__/api/
  e2e: e2e/
coverage:
  ut:
    tool: jest
    thresholds:
      line: 80
      branch: 70
      function: 80
    formats:
      - lcov
      - html
      - text
    excludes:
      - '**/*.d.ts'
      - '**/index.ts'
      - '**/*.config.*'
  it:
    tool: jest
    thresholds:
      line: 60
      branch: 50
    formats:
      - lcov
      - html
    excludes:
      - '**/*.config.*'
scope: project
